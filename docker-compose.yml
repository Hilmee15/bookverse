services:
  # ---------- Database (tier 3) ----------
  db:
    image: postgres:16.4-alpine          
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data  
    healthcheck:                          
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booknet
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - booknet
    restart: unless-stopped

  # ---------- Backend API (tier 2) ----------
  backend:
    build: ./backend                       
    environment:
      DATABASE_URL: ${DATABASE_URL}        
      REDIS_URL: ${REDIS_URL}              
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy         
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"                        
    networks:
      - booknet
    restart: unless-stopped

  # ---------- Frontend (tier 1) ----------
  frontend:
    build: ./frontend                      
    depends_on:
      - backend
    ports:
      - "3000:80"                          
    networks:
      - booknet
    restart: unless-stopped

  # ---------- DB admin UI, only runs with --profile tools ----------
  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - booknet

networks:
  booknet:
    driver: bridge

volumes:
  pgdata:
  redisdata:
