# BookVerse frontend server config
# - serves the built React SPA
# - reverse-proxies /api to the backend container by SERVICE NAME
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: browser only ever talks to nginx (no CORS needed).
    # "backend" resolves via Docker's user-defined network DNS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health probe of the backend, also reachable through this origin
    location = /health {
        proxy_pass http://backend:8000;
    }

    # Long-cache fingerprinted static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
