<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a16207"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">BookVerse — Multi-tier Architecture (Docker Compose on localhost)</text>

  <!-- Browser -->
  <rect x="40" y="90" width="160" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="120" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Browser (User)</text>
  <text x="120" y="142" text-anchor="middle" font-size="11" fill="#475569">http://localhost:3000</text>

  <!-- Network boundary -->
  <rect x="260" y="60" width="710" height="410" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="278" y="86" font-size="12" font-weight="600" fill="#a16207">user-defined network: booknet (bridge) — containers resolve each other by service name</text>

  <!-- frontend -->
  <rect x="300" y="110" width="180" height="95" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="390" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">frontend · nginx</text>
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="#3730a3">port 3000 → container 80</text>
  <text x="390" y="176" text-anchor="middle" font-size="11" fill="#3730a3">React SPA · reverse proxy /api</text>

  <!-- backend -->
  <rect x="600" y="110" width="180" height="95" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="690" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">backend · FastAPI</text>
  <text x="690" y="158" text-anchor="middle" font-size="11" fill="#9a3412">port 8000 · uvicorn</text>
  <text x="690" y="176" text-anchor="middle" font-size="11" fill="#9a3412">TF-IDF recommender (scikit-learn)</text>

  <!-- db -->
  <rect x="300" y="310" width="180" height="95" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="390" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#172554">db · PostgreSQL 16</text>
  <text x="390" y="358" text-anchor="middle" font-size="11" fill="#1e40af">service port 5432 (internal)</text>
  <text x="390" y="376" text-anchor="middle" font-size="11" fill="#1e40af">tables: books, recommendation_history</text>

  <!-- redis -->
  <rect x="600" y="310" width="180" height="95" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="690" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#450a0a">redis · cache</text>
  <text x="690" y="358" text-anchor="middle" font-size="11" fill="#991b1b">service port 6379 (internal)</text>
  <text x="690" y="376" text-anchor="middle" font-size="11" fill="#991b1b">caches recommendation results (TTL)</text>

  <!-- adminer -->
  <rect x="820" y="310" width="130" height="95" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="885" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">adminer</text>
  <text x="885" y="360" text-anchor="middle" font-size="11" fill="#166534">port 8080</text>
  <text x="885" y="378" text-anchor="middle" font-size="11" fill="#166534">profile: tools</text>

  <!-- Volumes -->
  <g>
    <rect x="315" y="530" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="340" cy="550" rx="10" ry="5" fill="#cbd5e1"/><ellipse cx="340" cy="558" rx="10" ry="5" fill="#cbd5e1"/><ellipse cx="340" cy="566" rx="10" ry="5" fill="#cbd5e1"/>
    <text x="405" y="558" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">named volume</text>
    <text x="405" y="576" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#334155">pgdata</text>
  </g>
  <g>
    <rect x="615" y="530" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="640" cy="550" rx="10" ry="5" fill="#cbd5e1"/><ellipse cx="640" cy="558" rx="10" ry="5" fill="#cbd5e1"/><ellipse cx="640" cy="566" rx="10" ry="5" fill="#cbd5e1"/>
    <text x="705" y="558" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">named volume</text>
    <text x="705" y="576" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#334155">redisdata</text>
  </g>

  <!-- Arrows -->
  <line x1="200" y1="130" x2="298" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="249" y="118" text-anchor="middle" font-size="11" fill="#475569">① HTTP</text>

  <line x1="480" y1="150" x2="598" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="539" y="138" text-anchor="middle" font-size="11" fill="#475569">② /api → backend:8000</text>

  <line x1="660" y1="205" x2="560" y2="308" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="585" y="262" font-size="11" fill="#475569">③ cache</text>

  <line x1="640" y1="205" x2="450" y2="308" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="510" y="262" font-size="11" fill="#475569">④ SQL read / write</text>

  <line x1="850" y1="405" x2="480" y2="380" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <text x="660" y="420" text-anchor="middle" font-size="11" fill="#166534">⑤ inspect tables (--profile tools)</text>

  <line x1="390" y1="405" x2="390" y2="528" stroke="#a16207" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <line x1="690" y1="405" x2="690" y2="528" stroke="#a16207" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>

  <!-- Legend -->
  <rect x="40" y="620" width="930" height="62" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="644" font-size="12" font-weight="600" fill="#0f172a">Request flow:</text>
  <text x="58" y="664" font-size="11.5" fill="#334155">① User opens localhost:3000 → ② nginx serves the React app and proxies /api to the backend container → ③ FastAPI checks the Redis cache →</text>
  <text x="58" y="678" font-size="11.5" fill="#334155">④ recommendations are computed (TF-IDF) and history is written to PostgreSQL (persists in the pgdata volume) → ⑤ Adminer (optional profile) inspects the database.</text>
</svg>
